<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Game&Clic Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="script.js"></script>
<div class="container">
    
    <!-- LADO IZQUIERDO -->
    <div class="left">
        <img src="img/logo.png" alt="Game&Clic Logo" class="logo">
        <h2>¿Tienes algo que decir?.</h2>
    </div>

    <!-- LADO DERECHO -->
    <div class="right">
        <form class="login-box">
            <input type="text" placeholder="Correo electrónico o teléfono">
            <input type="password" placeholder="Contraseña">
            
            <button class="btn-login">Iniciar sesión</button>
            
            <a href="#">¿Olvidaste tu contraseña?</a>
            
            <hr>
            
            <button class="btn-create">Crear nueva cuenta</button>
        </form>
    </div>

</div>

</body>
</html>
